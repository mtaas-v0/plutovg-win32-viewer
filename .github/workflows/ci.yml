name: CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    name: Windows (${{ matrix.compiler }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: msvc
            cmake_generator: "Visual Studio 17 2022"
          - compiler: mingw
            cmake_generator: "MinGW Makefiles"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MinGW
        if: matrix.compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          platform: x64

      - name: Configure (MSVC)
        if: matrix.compiler == 'msvc'
        run: >
          cmake -B build
          -G "${{ matrix.cmake_generator }}"
          -A x64

      - name: Configure (MinGW)
        if: matrix.compiler == 'mingw'
        run: >
          cmake -B build
          -G "${{ matrix.cmake_generator }}"
          -DCMAKE_BUILD_TYPE=Release
      #cmake -B build -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"
      #static build if bundler not working

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlutoVGViewer-${{ matrix.compiler }}-r${{ github.run_number }}
          path: |
            build/Release/PlutoVGViewer.exe
            build/PlutoVGViewer.exe
            
